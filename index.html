<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Médiation sociale : à vous de jouer</title>
<style>
:root{--bg:#dfe7ec;--ink:#16262f;--muted:#51646f;--sun:#f2b705;--good:#1f8a5b;--mid:#2f6fb5;--bad:#b5402f;--panel:#f7fafb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;padding:20px}
main{max-width:920px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.3rem,3.5vw,1.9rem);margin:0}
.bar{display:flex;gap:8px}
.btn{font:600 .95rem system-ui,sans-serif;padding:9px 16px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.btn.main{background:var(--sun)}
.btn:hover,.btn:focus-visible{outline:3px solid var(--ink)}

.stage{position:relative;aspect-ratio:16/9;min-height:340px;background:#16262f;border-radius:10px;overflow:hidden;border:3px solid var(--ink)}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:#0009}
.chars{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(3rem,13vw,7rem);padding-bottom:40px}
.caption{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:linear-gradient(transparent,#000d);color:#fff;font-size:clamp(.95rem,2.3vw,1.2rem);min-height:3.4em;z-index:2}

.menu{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;align-content:center}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border:2px solid #fff;border-radius:10px;background:#ffffff1f;color:#fff;font:inherit;cursor:pointer}
.opt b{font-family:Georgia,serif;font-size:1.05rem}
.opt span{font-size:.85rem;opacity:.85}
.opt:hover,.opt:focus-visible{background:#ffffff40;outline:3px solid var(--sun)}

.hot{position:absolute;z-index:4;top:30%;height:38%;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;
  border:3px solid var(--sun);border-radius:10px;background:#1f6f78c8;color:#fff;font:600 clamp(.8rem,1.9vw,1.05rem)/1.3 system-ui,sans-serif;cursor:pointer;animation:pulse 1.8s ease-in-out infinite}
.hot:hover,.hot:focus-visible{background:#1f6f78;outline:3px solid #fff;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 8px #f2b70566}}
@media (prefers-reduced-motion:reduce){.hot{animation:none}}

.panel{margin-top:14px;background:var(--panel);border-radius:10px;padding:16px 18px;border-left:6px solid #1f6f78}
.panel h2{font-family:Georgia,serif;font-size:1.2rem;margin:0 0 4px}
.panel p{margin:0;max-width:70ch}
.panel.good{border-color:var(--good)}.panel.mid{border-color:var(--mid)}.panel.bad{border-color:var(--bad)}
.acts{margin-top:12px;display:flex;gap:8px}
[hidden]{display:none!important}
@media(max-width:560px){.menu{grid-template-columns:1fr}}

.art{position:absolute;inset:0;width:100%;height:100%}
.ch{animation:enter 1s ease-out both}
@keyframes enter{from{transform:translate(var(--from),0);opacity:0}}
.bod{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.03)}}
.mouth{transform-box:fill-box;transform-origin:center}
.talk .bod{animation:bob .4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-1.5px)}}
.talk .mouth{animation:mth .22s steps(2) infinite}
@keyframes mth{50%{transform:scaleY(2.4)}}
.angry .bod{animation:shake .3s linear infinite}
@keyframes shake{25%{transform:translateX(-.8px)}75%{transform:translateX(.8px)}}
.tw{animation:tw 2s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
.blink{animation:tw 1.3s steps(2) infinite}
.glow{animation:tw 3s ease-in-out infinite alternate}
.cloud{animation:cl 25s linear infinite alternate}
@keyframes cl{to{transform:translateX(40px)}}
.swing{transform-origin:80px 0;animation:sw 3s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.ball{animation:bl .7s cubic-bezier(.3,0,.7,1) infinite alternate}
@keyframes bl{from{transform:translateY(-22px)}to{transform:translateY(0)}}
.curtain{transform-origin:15px 12px;animation:cu 4s ease-in-out infinite alternate}
@keyframes cu{to{transform:skewX(-4deg)}}
.bubble{position:absolute;z-index:3;top:16%;transform:translateX(-50%);max-width:38%;background:#fff;color:var(--ink);padding:8px 12px;border-radius:12px;font-size:clamp(.75rem,1.7vw,1rem);line-height:1.3;box-shadow:0 2px 8px #0005;animation:pop .3s ease-out}
.bubble:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.prob{position:absolute;z-index:3;left:6%;right:6%;top:5%;background:var(--sun);color:var(--ink);padding:10px 16px;border-radius:10px;font:600 clamp(.85rem,2vw,1.15rem)/1.3 Georgia,serif;animation:drop .5s ease-out}
.prob small{display:block;font:700 .7rem system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.intro{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:#16262ff2;color:#fff}
.intro h3{font-family:Georgia,serif;margin:0;font-size:clamp(1.2rem,3.5vw,2rem)}
.intro p{margin:0;max-width:34em;font:600 clamp(1rem,2.6vw,1.4rem)/1.35 Georgia,serif;color:var(--sun)}
.intro small{opacity:.7}
.hot{top:47%;height:30%}
@media (prefers-reduced-motion:reduce){.ch,.bod,.tw,.blink,.glow,.cloud,.swing,.ball,.curtain,.mouth{animation:none!important}}
.menu{overflow-y:auto;align-content:start}
.opt{padding:10px 12px}
.opt span{font-size:.8rem}
.rnd{grid-column:1/-1;background:var(--sun);border-color:var(--sun);color:var(--ink)}
.rnd:hover,.rnd:focus-visible{background:#ffd23f}
.hot:disabled{opacity:.5;cursor:wait;animation:none}
.hot:disabled:hover{background:#1f6f78c8;outline:none}
</style>
</head>
<body>
<main>
  <header>
    <h1>Médiation sociale : à vous de jouer</h1>
    <div class="bar">
      <button class="btn" id="voice">🔊 Voix off : oui</button>
      <button class="btn" id="menuBtn">Menu</button>
    </div>
  </header>

  <div class="stage" id="stage"></div>

  <section class="panel" id="panel">
    <h2 id="title"></h2>
    <p id="msg"></p>
    <div class="acts" id="acts" hidden>
      <button class="btn" id="replay">Rejouer ce scénario</button>
      <button class="btn main" id="rnd">🎲 Scénario au hasard</button>
      <button class="btn" id="toMenu">Choisir un scénario</button>
    </div>
  </section>
</main>

/* ============================================================
   MOTEUR
   ============================================================ */
const $ = s => document.querySelector(s);
const stage = $("#stage");
const synth = window.speechSynthesis;
let run = 0, voice = true, cur = null;

/* Voix off : lit le texte puis appelle cb ; sans voix, attend un délai */
function say(txt, cb) {
  const r = run, go = () => { if (r === run) cb(); };
  if (!voice || !synth) { setTimeout(go, Math.max(2200, txt.length * 55)); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = "fr-FR"; u.rate = .95;
  const v = synth.getVoices().find(x => x.lang && x.lang.startsWith("fr"));
  if (v) u.voice = v;
  u.onend = go; u.onerror = go;
  synth.speak(u);
}

function sayThen(txt, cb) {
  if (!voice || !synth) cb(); else say(txt, cb);
}

function menu() {
  run++; if (synth) synth.cancel();
  $("#title").textContent = "Choisissez une situation";
  $("#msg").textContent = "Chaque scénario a plusieurs fins possibles.";
  $("#panel").className = "panel"; $("#acts").hidden = true;
  stage.style.background = "linear-gradient(160deg,#27515c,#16262f)";
  stage.innerHTML = '<div class="menu"><button class="opt rnd" id="rndMenu"><b>🎲 Scénario au hasard</b><span>Une situation tirée au sort parmi ' + SCENARIOS.length + '</span></button>' + SCENARIOS.map((s, i) =>
    '<button class="opt" data-i="' + i + '"><b>' + s.name + '</b><span>' + s.desc + '</span></button>').join("") + "</div>";
  stage.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    cur = SCENARIOS[b.dataset.i].start; intro(+b.dataset.i);
  });
  $("#rndMenu").onclick = randomScenario;
}

const played = new Set();
function randomScenario() {
  let pool = SCENARIOS.map((_, i) => i).filter(i => !played.has(i));
  if (!pool.length) { played.clear(); pool = SCENARIOS.map((_, i) => i); }
  intro(pool[Math.floor(Math.random() * pool.length)]);
}

function person(k, x, from, mood) {
  const [h, sk, sh] = PPL[k];
  const brows = mood === "angry" ? '<path d="M-5 -30L-1 -28.5M5 -30L1 -28.5" stroke="#111" stroke-width=".9"/>' : "";
  return '<g transform="translate(' + x + ' 84) scale(1.5)"><g class="ch' + (mood === "angry" ? " angry" : "") + '" style="--from:' + from + 'px">' +
    '<g class="bod"><rect x="-7" y="-20" width="14" height="20" rx="5" fill="' + sh + '"/>' +
    '<circle cy="-26" r="7" fill="' + sk + '"/><path d="M-7.2 -27A7.2 7.2 0 0 1 7.2 -27Z" fill="' + h + '"/>' +
    '<circle cx="-2.5" cy="-26" r=".9" fill="#111"/><circle cx="2.5" cy="-26" r=".9" fill="#111"/>' + brows +
    '<path class="mouth" d="' + MOUTH[mood] + '" stroke="#111" fill="none" stroke-width=".9" stroke-linecap="round"/></g></g></g>';
}

function scene(id, s) {
  const [back, front] = ART[s.bg], cast = CAST[id];
  const xs = cast.length === 1 ? [80] : [50, 110];
  const m = s.end === "good" ? "happy" : s.end === "bad" ? "angry" : s.end === "mid" ? "sad" : MOOD[id] || "neutral";
  return '<svg class="art" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice">' + back +
    [...cast].map((k, i) => person(k, xs[i], i ? 40 : -40, m)).join("") + front + "</svg>";
}

/* Carte d'ouverture : la problématique du scénario */
function intro(i) {
  const s = SCENARIOS[i], r = ++run; cur = s.start; played.add(i);
  $("#title").textContent = s.name; $("#msg").textContent = s.p;
  $("#panel").className = "panel"; $("#acts").hidden = true;
  stage.style.background = "#16262f";
  stage.innerHTML = '<div class="intro" id="intro"><small>Problématique</small><h3>' + s.name + '</h3><p>' + s.p + '</p></div>';
  const go = () => { if (r === run) play(s.start); };
  say("Problématique : " + s.p, go);
}

function play(id) {
  const s = SCENES[id], r = ++run;
  $("#title").textContent = s.t; $("#msg").textContent = "";
  $("#panel").className = "panel" + (s.end ? " " + s.end : ""); $("#acts").hidden = true;
  stage.style.background = "#16262f";
  stage.innerHTML = scene(id, s) + '<div class="caption" id="cap"></div>';
  const chs = stage.querySelectorAll(".ch"), bx = chs.length === 1 ? [50] : [31, 69];
  let i = 0, d = 0;
  (function next() {
    if (r !== run) return;
    stage.querySelectorAll(".bubble").forEach(b => b.remove());
    chs.forEach(c => c.classList.remove("talk"));
    if (i >= s.l.length) return finish(id, s);
    const t = s.l[i++], q = t.match(/«\s*(.*?)\s*»/);
    $("#cap").textContent = t;
    if (q) {
      const k = d++ % chs.length;
      chs[k].classList.add("talk");
      const b = document.createElement("div");
      b.className = "bubble"; b.textContent = q[1]; b.style.left = bx[k] + "%";
      stage.appendChild(b);
    }
    say(t, next);
  })();
}

function finish(id, s) {
  if (s.end) {
    $("#msg").textContent = s.d; $("#acts").hidden = true;
    sayThen(s.d, () => { $("#acts").hidden = false; }); return;
  }
  const r = run, n = s.c.length, opts = s.c.slice().sort(() => Math.random() - .5);
  $("#cap").textContent = "";
  const pr = document.createElement("div");
  pr.className = "prob"; pr.innerHTML = "<small>Problématique</small>" + PQ[id];
  stage.appendChild(pr);
  say("Problématique : " + PQ[id], () => {
    if (r !== run) return;
    $("#cap").textContent = "Écoutez les options…";
    opts.forEach(([label, next], i) => {
      const b = document.createElement("button");
      b.className = "hot"; b.textContent = label; b.disabled = true;
      const w = n === 1 ? 50 : n === 2 ? 44 : 30;
      const left = n === 1 ? 25 : n === 2 ? [4, 52][i] : [2, 35, 68][i];
      b.style.left = left + "%"; b.style.width = w + "%";
      b.onclick = () => play(next);
      stage.appendChild(b);
    });
    sayThen("Que faites-vous ? " + opts.map((c, i) => "Option " + (i + 1) + " : " + c[0]).join(". "), () => {
      $("#cap").textContent = "Cliquez sur une zone de la vidéo.";
      stage.querySelectorAll(".hot").forEach(b => { b.disabled = false; });
    });
  });
}

$("#voice").onclick = () => {
  voice = !voice;
  $("#voice").textContent = voice ? "🔊 Voix off : oui" : "🔇 Voix off : non";
  if (!voice && synth) synth.cancel();
};
$("#menuBtn").onclick = menu;
$("#toMenu").onclick = menu;
$("#rnd").onclick = randomScenario;
$("#replay").onclick = () => play(cur);
if (synth) synth.getVoices();
menu();
</script>
